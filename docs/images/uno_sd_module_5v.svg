<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title { font-family: system-ui, sans-serif; font-size: 19px; font-weight: bold; fill: #cdd6f4; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #bac2de; }
      .box-board { fill: #181825; stroke: #89b4fa; stroke-width: 2; rx: 8; }
      .box-sd { fill: #181825; stroke: #a6e3a1; stroke-width: 2; rx: 8; }
      .pin-name { font-family: monospace; font-size: 13px; font-weight: bold; fill: #cdd6f4; }
      .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wire-vcc { stroke: #f38ba8; }
      .wire-gnd { stroke: #6c7086; }
      .wire-cs  { stroke: #fab387; }
      .wire-mosi{ stroke: #f9e2af; }
      .wire-miso{ stroke: #a6e3a1; }
      .wire-sck { stroke: #89b4fa; }
      .wire-cd  { stroke: #cba6f7; }
      .badge { fill: #a6e3a1; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="375" y="35" text-anchor="middle" class="title">Arduino Uno / Nano ➔ SD Module with Built-in 5V ➔ 3.3V Converter</text>

  <!-- Arduino Uno Block -->
  <rect x="50" y="80" width="240" height="300" class="box-board" />
  <text x="170" y="110" text-anchor="middle" class="title" fill="#89b4fa">Arduino Uno / Nano</text>
  <text x="170" y="130" text-anchor="middle" class="subtitle">(5V Logic)</text>

  <!-- SD Module Block -->
  <rect x="460" y="80" width="240" height="300" class="box-sd" />
  <text x="580" y="110" text-anchor="middle" class="title" fill="#a6e3a1">SD Module (5V ready)</text>
  <text x="580" y="130" text-anchor="middle" class="subtitle">(Built-in 3.3V LDO + LVC125)</text>

  <!-- Pins Left (Arduino) -->
  <text x="275" y="160" text-anchor="end" class="pin-name">5V</text>
  <text x="275" y="190" text-anchor="end" class="pin-name">GND</text>
  <text x="275" y="220" text-anchor="end" class="pin-name">D10 (SS)</text>
  <text x="275" y="250" text-anchor="end" class="pin-name">D11 (MOSI)</text>
  <text x="275" y="280" text-anchor="end" class="pin-name">D12 (MISO)</text>
  <text x="275" y="310" text-anchor="end" class="pin-name">D13 (SCK)</text>
  <text x="275" y="340" text-anchor="end" class="pin-name">A0 (Analog)</text>

  <!-- Pins Right (SD Module) -->
  <text x="475" y="160" text-anchor="start" class="pin-name">VCC (5V)</text>
  <text x="475" y="190" text-anchor="start" class="pin-name">GND</text>
  <text x="475" y="220" text-anchor="start" class="pin-name">CS</text>
  <text x="475" y="250" text-anchor="start" class="pin-name">MOSI</text>
  <text x="475" y="280" text-anchor="start" class="pin-name">MISO</text>
  <text x="475" y="310" text-anchor="start" class="pin-name">SCK</text>
  <text x="475" y="340" text-anchor="start" class="pin-name">CD (optional)</text>

  <!-- Wires -->
  <path d="M 285 156 L 465 156" class="wire wire-vcc" />
  <path d="M 285 186 L 465 186" class="wire wire-gnd" />
  <path d="M 285 216 L 465 216" class="wire wire-cs" />
  <path d="M 285 246 L 465 246" class="wire wire-mosi" />
  <path d="M 285 276 L 465 276" class="wire wire-miso" />
  <path d="M 285 306 L 465 306" class="wire wire-sck" />
  <path d="M 285 336 L 465 336" class="wire wire-cd" />

  <!-- Dots -->
  <circle cx="285" cy="156" r="4" fill="#f38ba8" />
  <circle cx="465" cy="156" r="4" fill="#f38ba8" />
  <circle cx="285" cy="186" r="4" fill="#6c7086" />
  <circle cx="465" cy="186" r="4" fill="#6c7086" />
  <circle cx="285" cy="216" r="4" fill="#fab387" />
  <circle cx="465" cy="216" r="4" fill="#fab387" />
  <circle cx="285" cy="246" r="4" fill="#f9e2af" />
  <circle cx="465" cy="246" r="4" fill="#f9e2af" />
  <circle cx="285" cy="276" r="4" fill="#a6e3a1" />
  <circle cx="465" cy="276" r="4" fill="#a6e3a1" />
  <circle cx="285" cy="306" r="4" fill="#89b4fa" />
  <circle cx="465" cy="306" r="4" fill="#89b4fa" />
  <circle cx="285" cy="336" r="4" fill="#cba6f7" />
  <circle cx="465" cy="336" r="4" fill="#cba6f7" />
</svg>
