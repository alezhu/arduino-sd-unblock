[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

[env:esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino

[env:lgt8f328p]
platform = lgt8f
board = lgt8f328p
framework = arduino
