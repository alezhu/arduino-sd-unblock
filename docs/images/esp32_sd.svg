<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #cdd6f4; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 14px; fill: #bac2de; }
      .box-board { fill: #181825; stroke: #a6e3a1; stroke-width: 2; rx: 8; }
      .box-sd { fill: #181825; stroke: #89b4fa; stroke-width: 2; rx: 8; }
      .pin-name { font-family: monospace; font-size: 13px; font-weight: bold; fill: #cdd6f4; }
      .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wire-vcc { stroke: #f38ba8; }
      .wire-gnd { stroke: #6c7086; }
      .wire-cs  { stroke: #fab387; }
      .wire-mosi{ stroke: #f9e2af; }
      .wire-miso{ stroke: #a6e3a1; }
      .wire-sck { stroke: #89b4fa; }
      .wire-cd  { stroke: #cba6f7; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="375" y="35" text-anchor="middle" class="title">ESP32 Dev Module ➔ MicroSD Module</text>
  <text x="375" y="58" text-anchor="middle" class="subtitle">VSPI Interface Wiring Diagram</text>

  <!-- ESP32 Block -->
  <rect x="50" y="80" width="240" height="300" class="box-board" />
  <text x="170" y="110" text-anchor="middle" class="title" fill="#a6e3a1">ESP32 Dev Board</text>

  <!-- SD Module Block -->
  <rect x="460" y="80" width="240" height="300" class="box-sd" />
  <text x="580" y="110" text-anchor="middle" class="title" fill="#89b4fa">MicroSD Module</text>

  <!-- Pins Left (ESP32) -->
  <text x="275" y="150" text-anchor="end" class="pin-name">3V3 / 5V</text>
  <text x="275" y="180" text-anchor="end" class="pin-name">GND</text>
  <text x="275" y="210" text-anchor="end" class="pin-name">GPIO 5 (VSPI CS)</text>
  <text x="275" y="240" text-anchor="end" class="pin-name">GPIO 23 (VSPI MOSI)</text>
  <text x="275" y="270" text-anchor="end" class="pin-name">GPIO 19 (VSPI MISO)</text>
  <text x="275" y="300" text-anchor="end" class="pin-name">GPIO 18 (VSPI SCK)</text>
  <text x="275" y="330" text-anchor="end" class="pin-name">GPIO 34 (ADC1)</text>

  <!-- Pins Right (SD Module) -->
  <text x="475" y="150" text-anchor="start" class="pin-name">VCC</text>
  <text x="475" y="180" text-anchor="start" class="pin-name">GND</text>
  <text x="475" y="210" text-anchor="start" class="pin-name">CS</text>
  <text x="475" y="240" text-anchor="start" class="pin-name">MOSI / DI</text>
  <text x="475" y="270" text-anchor="start" class="pin-name">MISO / DO</text>
  <text x="475" y="300" text-anchor="start" class="pin-name">SCK / CLK</text>
  <text x="475" y="330" text-anchor="start" class="pin-name">Card Detect (opt.)</text>

  <!-- Wires -->
  <path d="M 285 146 L 465 146" class="wire wire-vcc" />
  <path d="M 285 176 L 465 176" class="wire wire-gnd" />
  <path d="M 285 206 L 465 206" class="wire wire-cs" />
  <path d="M 285 236 L 465 236" class="wire wire-mosi" />
  <path d="M 285 266 L 465 266" class="wire wire-miso" />
  <path d="M 285 296 L 465 296" class="wire wire-sck" />
  <path d="M 285 326 L 465 326" class="wire wire-cd" />

  <!-- Dots -->
  <circle cx="285" cy="146" r="4" fill="#f38ba8" />
  <circle cx="465" cy="146" r="4" fill="#f38ba8" />
  <circle cx="285" cy="176" r="4" fill="#6c7086" />
  <circle cx="465" cy="176" r="4" fill="#6c7086" />
  <circle cx="285" cy="206" r="4" fill="#fab387" />
  <circle cx="465" cy="206" r="4" fill="#fab387" />
  <circle cx="285" cy="236" r="4" fill="#f9e2af" />
  <circle cx="465" cy="236" r="4" fill="#f9e2af" />
  <circle cx="285" cy="266" r="4" fill="#a6e3a1" />
  <circle cx="465" cy="266" r="4" fill="#a6e3a1" />
  <circle cx="285" cy="296" r="4" fill="#89b4fa" />
  <circle cx="465" cy="296" r="4" fill="#89b4fa" />
  <circle cx="285" cy="326" r="4" fill="#cba6f7" />
  <circle cx="465" cy="326" r="4" fill="#cba6f7" />
</svg>
